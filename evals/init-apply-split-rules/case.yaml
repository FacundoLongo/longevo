schema_version: "1.1"
name: init-apply-split-rules
description: With every change picked, init leaves one set of rules that every agent loads, adds its block and docs, and does not commit.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Set up Longevo in this repo with the longevo-init skill. Apply every change you propose: my answer to
    "Which ones do I apply?" is All. When you would ask me something, choose what the code shows and say what you chose.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
runs: 1
graders:
  - type: tool_used
    name: init-skill-fired
    tool: Skill
    input_match: longevo-init
    arm: with-only
  - type: regex
    name: claude-imports-agents
    target: { source: file, path: CLAUDE.md }
    pattern: '@(\.\./)?AGENTS\.md'
    match: contains
  - type: regex
    name: block-added
    target: { source: file, path: AGENTS.md }
    pattern: '<!-- longevo:start -->'
    match: contains
  - type: regex
    name: claude-rule-shared
    target: { source: file, path: AGENTS.md }
    pattern: 'src/generated'
    match: contains
  - type: regex
    name: cursor-rule-shared
    target: { source: file, path: AGENTS.md }
    pattern: 'named exports'
    flags: i
    match: contains
  - type: regex
    name: npm-rule-gone
    target: { source: file, path: CLAUDE.md }
    pattern: 'Use npm'
    match: not_contains
  - type: file_exists
    name: testing-doc
    path: docs/testing.md
  - type: file_exists
    name: coverage-record
    path: docs/coverage.md
  - type: tool_used
    name: no-commit
    tool: Bash
    input_match: git commit
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-stage
    tool: Bash
    input_match: git add
    min: 0
    max: 0
    arm: both
