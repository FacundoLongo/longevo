schema_version: "1.1"
name: init-asks-first
description: The init skill finds rules split across CLAUDE.md, AGENTS.md and a Cursor rule, proposes numbered changes, asks which ones to apply and writes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Review the agent instruction files in this repo and tell me what to fix.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
runs: 1
graders:
  - type: tool_used
    name: init-skill-fired
    tool: Skill
    input_match: longevo-init
    arm: with-only
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-apply
    tool: Bash
    input_match: longevo.mjs apply
    min: 0
    max: 0
    arm: with-only
  - type: regex
    name: asks-which-ones
    pattern: Which ones do I apply
    flags: i
    match: contains
  - type: llm
    name: finds-split-rules
    focus: last_message
    criteria: >
      Pass only if the final message does all four: (1) says that CLAUDE.md does not import AGENTS.md, so Claude Code
      and the other agents see different rules; (2) points out that CLAUDE.md says npm while AGENTS.md says pnpm;
      (3) shows a numbered list of proposed changes; (4) does not say that it already edited, created or deleted
      a file. Saying what it will do after the user picks is fine.
