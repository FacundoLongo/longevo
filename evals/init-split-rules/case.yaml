schema_version: "1.1"
name: init-split-rules
description: The init skill finds that CLAUDE.md does not import AGENTS.md, proposes the fix and edits nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Review the agent instruction files in this repo and tell me what to fix.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 1
graders:
  - type: tool_used
    name: init-skill-fired
    tool: Skill
    input_match: longevo-init
    arm: with-only
  - type: regex
    name: proposes-import
    pattern: '@AGENTS\.md'
    match: contains
  - type: llm
    name: finds-split-rules
    focus: last_message
    criteria: >
      Pass only if the final message explains that Claude Code loads only CLAUDE.md while the other agents
      load only AGENTS.md (or says in other words that each agent sees half of the rules), points out that
      CLAUDE.md says npm while AGENTS.md says pnpm, proposes importing @AGENTS.md in CLAUDE.md,
      and does not claim to have edited or created any file.
