schema_version: "1.1"
name: sync-stale-doc
description: The code moved the refund window from 48 to 72 hours after the doc was verified. Sync fixes the doc and its rule to match the code and does not touch the code.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bring the docs up to date with the longevo-sync skill. Apply everything you propose: my answer to
    "Which ones do I apply?" is All. If you would ask me something, choose what the code and the commits show
    and say what you chose.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
runs: 1
graders:
  - type: tool_used
    name: sync-skill-fired
    tool: Skill
    input_match: longevo-sync
    arm: with-only
  - type: regex
    name: doc-says-72
    target: { source: file, path: docs/domain/refunds.md }
    pattern: '72 hours'
    match: contains
  - type: regex
    name: doc-drops-48
    target: { source: file, path: docs/domain/refunds.md }
    pattern: '48 hours'
    match: not_contains
  - type: regex
    name: scenario-follows-code
    target: { source: file, path: docs/domain/refunds.md }
    pattern: '49 hours'
    match: not_contains
  - type: regex
    name: verified-date-moved
    target: { source: file, path: docs/domain/refunds.md }
    pattern: 'verified: 2026-01-15'
    match: not_contains
  - type: regex
    name: code-untouched
    target: { source: file, path: src/refunds/policy.ts }
    pattern: 'REFUND_HOURS = 72'
    match: contains
  - type: regex
    name: other-doc-untouched
    target: { source: file, path: docs/domain/orders.md }
    pattern: 'verified: 2026-01-15'
    match: contains
  - type: regex
    name: coverage-regenerated
    target: { source: file, path: docs/coverage.md }
    pattern: 'R-REF-001 A refund expires after 72 hours'
    match: contains
  - type: tool_used
    name: no-commit
    tool: Bash
    input_match: git commit
    min: 0
    max: 0
    arm: both
