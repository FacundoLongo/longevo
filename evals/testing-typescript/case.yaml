schema_version: "1.1"
name: testing-typescript
description: The testing skill plans and writes tests for a small Node module and uses the real store.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Write tests for placeOrder in src/orders.mjs. Put them in test/orders.test.mjs and run them with node --test.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
runs: 1
graders:
  - type: tool_used
    name: testing-skill-fired
    tool: Skill
    input_match: longevo-testing
    arm: with-only
  - type: file_exists
    name: test-file-written
    path: test/orders.test.mjs
  - type: regex
    name: store-not-mocked
    target: { source: file, path: test/orders.test.mjs }
    pattern: mock
    flags: i
    match: not_contains
  - type: llm
    name: plan-and-run
    focus: last_message
    criteria: >
      Pass only if the final message does all three: (1) lists each test it wrote together with the bug
      or code change that test would catch; (2) lists at least one case it chose not to test, with a reason;
      (3) says that the tests ran and passed. Wording and table layout do not matter.
